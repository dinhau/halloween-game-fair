<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#161023"><title>麗喆303班｜手機十秒封印術</title><link rel="stylesheet" href="/phone.css"></head><body>
<header><a href="/">麗喆 <b>303</b> 班</a><span id="conn">○ 尚未配對</span></header>
<main><div class="eyebrow">THE SECRET SEAL · LIVE CHALLENGE</div><h1>十秒<span>封印術</span></h1><p class="intro">一份勇氣，一次機會。<br>憑感覺，抓住神祕的十秒。</p>
<section id="pair-stage" class="card"><h2>由工作人員手機掃描螢幕 QR</h2><p>螢幕端按「連線手機」建立房間，掃描後核對四位碼，再由螢幕核准。</p><div id="verify"></div><p id="pair-message"></p><button id="join-retry" hidden>重新提出配對</button></section>
<section id="game-stage" class="card" hidden><div class="round-tag" id="round"></div><div id="game-content"></div></section>
<p id="error" role="status" aria-live="polite"></p><p class="footnote">工作人員專用手機 · 不需填姓名<br>手機計時，螢幕揭曉 · 兩端均需保持連線</p>
<button id="disconnect" class="quiet" hidden>重新配對手機</button></main>
<script src="/shared.js"></script><script src="/phone.js"></script></body></html>
